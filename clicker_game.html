<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .score {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-button:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

    <h1>Clicker Game</h1>
    <p>Clicca il più velocemente possibile!</p>
    <div class="score" id="score">Punteggio: 0</div>
    <button id="click-button">Clicca qui!</button>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const clickButton = document.getElementById('click-button');

        clickButton.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = `Punteggio: ${score}`;
        });
    </script>
    </br>
    <button class="back-button" onclick="window.location.href='index.html'">Torna alla homepage</button>

</body>
</html>
